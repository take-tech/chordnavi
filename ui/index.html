<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChordNavi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage" id="stage">
  <section class="left">
    <div class="panel">
      <h1>ChordNavi</h1>
      <svg id="wheel" viewBox="-210 -215 420 425" role="group" aria-label="五度圏"></svg>
      <div class="controls">
        <label for="keySel">キー</label>
        <select id="keySel"></select>
        <label for="scaleSel">スケール</label>
        <select id="scaleSel"></select>
        <label>表示</label>
        <div class="seg" id="labelSeg">
          <button data-v="name" aria-pressed="true">音名</button>
          <button data-v="degree" aria-pressed="false">度数</button>
        </div>
      </div>
      <div class="dia">
        <div class="dia-head">ダイアトニックコード<span class="spacer"></span><div class="seg small" id="diaSeg"><button data-v="7" aria-pressed="true">4和音</button><button data-v="3" aria-pressed="false">3和音</button></div></div>
        <div class="dia-grid" id="dia"></div>
      </div>
      <div class="notes">スケール構成音<b id="scaleNotes"></b></div>
    </div>
  </section>

  <section class="right">
    <div class="panel">
      <div class="head">
        <h2 id="kbTitle">鍵盤</h2>
        <div class="seg small" id="viewSeg"><button data-v="kb" aria-pressed="true">鍵盤</button><button data-v="staff" aria-pressed="false">五線譜</button></div>
        <button id="pickBtn" class="sync" aria-pressed="false" title="鍵盤・指板で音を選んでコードを判別">コード判別</button>
        <span class="spacer"></span>
        <div class="selinfo" id="selInfo"><span><b id="selName"></b> の構成音</span><button id="selClear">スケールに戻す</button></div>
        <div class="pickinfo" id="pickInfo"><span class="pk">判別：</span><span id="pickResult"></span><button id="pickPlay">鳴らす</button><button id="pickClear">クリア</button></div>
        <div class="legend" id="kbLegend">
          <span><i style="background:var(--root)"></i>ルート</span>
          <span><i style="background:var(--tone)"></i>スケール音</span>
          <span><i style="background:var(--chord)"></i>コード構成音</span>
        </div>
      </div>
      <svg id="kb"></svg>
      <svg id="staff" hidden></svg>
    </div>

    <div class="panel">
      <div class="head"><h2 id="fbTitle">ギター指板</h2>
        <div class="seg small" id="fbViewSeg"><button data-v="fb" aria-pressed="true">指板</button><button data-v="tab" aria-pressed="false">TAB</button></div>
        <div class="seg small" id="tabAreaSeg" hidden><button data-v="low" aria-pressed="true">ロー</button><button data-v="mid" aria-pressed="false">ミドル</button><button data-v="high" aria-pressed="false">ハイ</button></div>
        <span class="spacer"></span><span class="legend" id="fbLegend">レギュラーチューニング・上が1弦</span></div>
      <svg id="fb"></svg>
      <svg id="tab" hidden></svg>
    </div>

    <div class="panel prog-panel">
      <div class="head">
        <h2>コード進行</h2><span class="spacer"></span>
        <label class="bpm" for="timbre">音色 <select id="timbre"></select></label>
        <label class="bpm" for="bpm">テンポ <input id="bpm" type="number" min="40" max="240" value="120"></label>
        <button id="bpmSync" class="sync" aria-pressed="false" hidden>DAW同期</button>
      </div>
      <div class="pills" id="pills"></div>
      <div class="more-pop" id="morePop" hidden></div>
      <div class="variants" id="variants"></div>
      <div class="detail">
        <div class="detail-head">
          <h3 id="progName"></h3><span class="deg" id="progDeg"></span>
          <div class="actions">
            <button class="handle" id="progDrag" title="DAWのトラックへドラッグ">進行をドラッグ</button>
            <button id="progPlay">試聴</button><button id="progLoop" aria-pressed="false" title="進行を繰り返し試聴">ループ</button><button id="progHalf" aria-pressed="false" title="各コードの長さを半分にする（試聴・MIDI）">リズム½</button><button id="progDl">MIDI保存</button>
          </div>
        </div>
        <div class="chips" id="chips"></div>
        <div class="editbar" id="editBar"></div>
        <p class="hint" id="hint">コードをクリックで試聴と構成音表示。コードや「進行をドラッグ」をDAWへドラッグするとMIDIを配置できます（1コード＝1小節）。</p>
      </div>
    </div>
  </section>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
