name: Build Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  macos:
    name: macOS Installer
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-release --config Release --target MidiExportTests ChordNavi_VST3 ChordNavi_AU ChordNavi_Standalone -j4

      - name: Unit tests
        run: ./build-release/MidiExportTests_artefacts/Release/MidiExportTests

      - name: Import Apple Developer ID certificates
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12_BASE64" ] || [ -z "$MACOS_CERTIFICATE_PASSWORD" ]; then
            echo "Apple Developer ID certificate secrets are not configured; skipping certificate import."
            exit 0
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-temporary-keychain-password}"

          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Package
        env:
          MACOS_APP_SIGN_IDENTITY: ${{ secrets.MACOS_APP_SIGN_IDENTITY }}
          MACOS_INSTALLER_SIGN_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGN_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" = "$GITHUB_REF_NAME" ]; then VERSION=""; fi
          CHORDNAVI_VERSION="$VERSION" ./scripts/package_macos.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChordNavi-macOS-pkg
          path: build-release/packages/*.pkg

  windows:
    name: Windows Installer
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WebView2 SDK
        shell: pwsh
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.1901.177 -OutputDirectory "$env:RUNNER_TEMP\nuget"

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DJUCE_WEBVIEW2_PACKAGE_LOCATION=$env:RUNNER_TEMP\nuget"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --target MidiExportTests ChordNavi_VST3 ChordNavi_Standalone -- /m

      - name: Unit tests
        shell: pwsh
        run: ./build/MidiExportTests_artefacts/Release/MidiExportTests.exe

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Package
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          if ($version -eq "${env:GITHUB_REF_NAME}") {
            $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(ChordNavi VERSION ([0-9.]+)\)').Matches[0].Groups[1].Value
          }
          $vst3 = Get-ChildItem -Path build -Recurse -Directory -Filter "ChordNavi.vst3" | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
          $app  = Get-ChildItem -Path build -Recurse -File -Filter "ChordNavi.exe" | Where-Object { $_.FullName -match "Standalone" } | Select-Object -First 1
          if (-not $vst3) { throw "ChordNavi.vst3 was not found under build" }
          if (-not $app)  { throw "ChordNavi.exe was not found under build" }
          New-Item -ItemType Directory -Force -Path build/packages | Out-Null
          $env:CHORDNAVI_VERSION = $version
          $env:CHORDNAVI_VST3_DIR = $vst3.FullName
          $env:CHORDNAVI_APP_EXE = $app.FullName
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/windows/ChordNavi.iss

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChordNavi-Windows-Setup
          path: build/packages/*.exe

  github-release:
    name: Attach To GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
