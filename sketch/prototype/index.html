<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChordSketch</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage" id="stage">
  <header class="top panel">
    <h1>ChordSketch</h1>
    <input id="title" class="title" maxlength="60" aria-label="曲名">
    <div class="transport">
      <button id="toStart" title="先頭へ（Home）">⏮</button>
      <button id="playBtn" class="play" title="Space キーでも再生／停止">▶ 再生</button>
      <button id="loopBtn" class="tg" aria-pressed="false" title="選択範囲（なければ曲全体）を繰り返す">ループ</button>
      <span class="pos" id="posDisp">1 : 1</span>
    </div>
    <label class="fld" title="1小節目のテンポ（途中の変更は小節番号をダブルクリック）">♩= <input id="bpm" type="number" min="20" max="300" step="1"></label>
    <label class="fld" title="1小節目の拍子">拍子 <select id="meter"></select></label>
    <select id="metro" title="メトロノーム（試聴のみ）"></select>
    <button id="countIn" class="tg" aria-pressed="false" title="再生の前に1小節クリック">カウント</button>
    <button id="muteBtn" class="tg" aria-pressed="false" title="ChordSketch の音をすべて消す（表示は動いたまま。M キー）">ミュート</button>
    <span class="spacer"></span>
    <button id="undo" class="ic" title="元に戻す（⌘Z）">↶</button><button id="redo" class="ic" title="やり直し（⇧⌘Z）">↷</button>
    <div class="menu">
      <button id="fileBtn">ファイル ▾</button>
      <div class="menu-pop" id="fileMenu" hidden>
        <button data-act="new">新規</button><button data-act="demo">サンプルを開く</button>
        <button data-act="open">開く…</button><button data-act="save">保存（.chordsketch）</button>
      </div>
    </div>
    <button id="printBtn" title="コード譜のプレビュー（印刷／PDF に保存）">コード譜</button>
    <button id="themeBtn" class="ic" title="テーマ（ライト→ダーク→自動）"></button>
    <input id="fileInput" type="file" accept=".chordsketch,.json" hidden>
  </header>

  <aside class="left panel">
    <svg id="wheel" viewBox="-210 -215 420 425" role="group" aria-label="五度圏"></svg>
    <div class="keyrow">
      <select id="keySel" aria-label="キー"></select>
      <button id="keepNames" class="tg small" aria-pressed="false" title="オン：キーを変えてもコード名を変えない（オフ：度数を保って移調）">音名を保つ</button>
    </div>
    <div class="sub-head">ダイアトニックコード<span class="spacer"></span>
      <div class="seg small" id="diaSeg"><button data-v="7" aria-pressed="true">4和音</button><button data-v="3" aria-pressed="false">3和音</button></div></div>
    <div class="palette" id="dia"></div>
    <div class="sub-head">コードを作る</div>
    <div class="builder">
      <select id="bRoot" aria-label="ルート"></select><select id="bQ" aria-label="種類"></select><span class="slash">/</span><select id="bBass" aria-label="ベース"></select>
    </div>
    <div class="palette one" id="custom"></div>
    <div class="sub-head">MIDI 入力 <span class="midi-st" id="midiSt"></span><span class="spacer"></span>
      <button id="stepBtn" class="tg small" aria-pressed="false" title="弾いたコードをカーソルの位置に入れて、入力の長さだけ進む">ステップ入力</button></div>
    <div class="live" id="live"><span class="muted">MIDI 鍵盤で弾くとコード名を表示</span></div>
    <label class="fld timbre">試聴の音色 <select id="timbre"></select></label>
    <p class="tip">パレットのコードは<b>クリックで試聴</b>、<b>シートへドラッグで配置</b>。カーソルがあるときは数字キー 1〜7 でダイアトニックを入力。</p>
  </aside>

  <main class="main panel">
    <div class="toolbar">
      <span class="lbl">スナップ</span>
      <div class="seg small" id="snapSeg"><button data-v="bar">1小節</button><button data-v="beat">1拍</button><button data-v="half" title="シンコペーション・食いのコード用">半拍</button></div>
      <label class="fld" title="パレット・数字キー・MIDI 鍵盤で入れるコードの長さ">入力の長さ <select id="insLen"></select></label>
      <span class="lbl">1行</span>
      <div class="seg small" id="rowSeg"><button data-v="4">4小節</button><button data-v="8">8小節</button></div>
      <span class="spacer"></span>
      <button class="handle" id="dragSel" draggable="true" title="選択範囲（なければ曲全体）を DAW へドラッグ">⠿ <span id="dragLabel">曲全体</span>をドラッグ</button>
      <button id="saveMidi">MIDI保存</button>
    </div>
    <div class="toolbar out">
      <span class="lbl strong">MIDI 出力</span>
      <label class="fld" title="曲全体のパターン（セクションごとに変えられます）">パターン <select id="pattern"></select></label>
      <span class="sep"></span>
      <span class="lbl">上声のオクターブ</span><div class="oct" id="octUp"></div>
      <span class="lbl">ベースのオクターブ</span><div class="oct" id="octBass"></div>
      <button id="bassBtn" class="tg small" aria-pressed="true" title="ベース音を出す">ベースを出す</button>
      <span class="spacer"></span>
      <span class="lbl" id="outInfo"></span>
    </div>
    <div class="sheet" id="sheet" tabindex="0" aria-label="コード譜"></div>
    <div class="footer" id="footer"></div>
  </main>
</div>

<div class="pop" id="pop" hidden></div>
<div class="ghost" id="ghost" hidden></div>
<datalist id="secNames"></datalist>
<div class="print-wrap" id="printWrap" hidden>
  <div class="print-bar"><b>コード譜のプレビュー</b><span class="spacer"></span>
    <label class="fld"><input type="checkbox" id="prDeg"> 度数も書く</label>
    <button id="prGo" class="tg" aria-pressed="true">印刷／PDF に保存</button><button id="prClose">閉じる</button></div>
  <div class="print-scroll"><div class="print" id="print"></div></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
