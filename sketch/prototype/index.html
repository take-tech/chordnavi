<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ChordSketch</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage" id="stage">
  <header class="top panel" aria-label="トップバー">
    <button id="sideBtn" class="tg ic side-btn" aria-pressed="true" aria-label="サイドパネル" title="サイドパネルを隠す・出す"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 3.5v13" stroke="currentColor" stroke-width="1.6"/><path d="M4.5 7h1.8M4.5 10h1.8M4.5 13h1.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
    <h1>ChordSketch</h1>
    <input id="title" class="title" maxlength="60" aria-label="曲名"><span id="fileState" class="file-state" hidden title="保存していない変更があります">●</span>
    <div class="transport" role="group" aria-label="トランスポート">
      <button id="toStart" title="先頭へ（Home）" aria-label="先頭へ"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><rect x="2.5" y="3" width="2" height="10" rx=".5" fill="currentColor"/><path d="M13.5 3.6v8.8a.6.6 0 0 1-.9.5L6.2 8.5a.6.6 0 0 1 0-1l6.4-4.4a.6.6 0 0 1 .9.5z" fill="currentColor"/></svg></button>
      <button id="playBtn" class="play" title="再生／停止（Space キー）" aria-label="再生"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M4.5 2.9v10.2a.7.7 0 0 0 1.1.6l7.6-5.1a.7.7 0 0 0 0-1.2L5.6 2.3a.7.7 0 0 0-1.1.6z" fill="currentColor"/></svg></button>
      <button id="recBtn" class="tg rec" aria-pressed="false" aria-label="録音" title="録音（R）：1小節前から再生して、弾いた音を録る"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><circle cx="8" cy="8" r="5.5" fill="currentColor"/></svg></button>
      <button id="loopBtn" class="tg loop" aria-pressed="false" aria-label="ループ" title="ループ：選択範囲（なければ曲全体）を繰り返す"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M5 7h8.5a3 3 0 0 1 0 6H12M15 13H6.5a3 3 0 0 1 0-6H8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M11 4.5 13.8 7 11 9.5M9 10.5 6.2 13 9 15.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="muteBtn" class="tg mute" aria-pressed="false" title="ミュート（M）" aria-label="ミュート">M</button>
    </div>
    <!-- 位置の表示（DAW のトランスポートと同じ並び）：今の位置のテンポ／拍子・キー、位置／経過時間。数字を押すとその値を変える -->
    <div class="lcd" id="lcd" role="group" aria-label="ディスプレイ">
      <button class="lcd-c l1" id="lcdTempo" title="テンポ：押して入力・上下にドラッグ（⇧で 0.1 ずつ）"><b id="lcdBpm">120.0</b></button>
      <span class="lcd-c r1 pos" id="posDisp" title="位置（小節.拍.16分）">1.1.1</span>
      <span class="lcd-c l2"><button id="lcdMeter" title="拍子（押すと変更）">4/4</button><button id="lcdKey" title="キー">C</button></span>
      <span class="lcd-c r2 time" id="lcdTime" title="経過時間（分:秒）">0:00.0</span>
    </div>
    <!-- メトロノーム（上）とカウントイン（下）。アイコンでオン／オフ、種類は ▾ から -->
    <div class="clickgrp" role="group" aria-label="クリック">
      <button id="metroBtn" class="tg ic2" aria-pressed="false" aria-label="メトロノーム" title="メトロノーム（試聴のみ）：オン／オフ"><svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><path d="M7.2 2.5h5.6l3.2 15H4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M5.2 13.5h9.6" stroke="currentColor" stroke-width="1.4"/><path d="M10 13.5 14.8 4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="13.3" cy="7.3" r="1.5" fill="currentColor"/></svg></button>
      <div class="menu">
        <button id="metroKind" class="ic2 kind" aria-haspopup="true" title="メトロノームの種類">▾</button>
        <div class="menu-pop metro-pop" id="metroMenu" hidden></div>
      </div>
      <button id="countIn" class="tg ic2" aria-pressed="false" aria-label="カウントイン" title="カウントイン（小節数は ▾）"><svg viewBox="0 0 28 10" width="26" height="9" aria-hidden="true"><circle cx="4" cy="5" r="2.2" fill="currentColor"/><circle cx="10.7" cy="5" r="2.2" fill="currentColor"/><circle cx="17.3" cy="5" r="2.2" fill="currentColor"/><circle cx="24" cy="5" r="2.2" fill="currentColor"/></svg></button>
      <div class="menu">
        <button id="countKind" class="ic2 kind" aria-haspopup="true" title="カウントインの小節数">▾</button>
        <div class="menu-pop metro-pop" id="countMenu" hidden>
          <button value="1" role="menuitemradio">1小節</button><button value="2" role="menuitemradio">2小節</button>
        </div>
      </div>
    </div>
    <span class="spacer"></span>
    <button id="phoneView" class="phone-only" title="コードビュー／メロディービューの切り替え">♪ メロ</button>
    <button id="undo" class="ic" title="元に戻す（⌘Z）">↶</button><button id="redo" class="ic" title="やり直し（⇧⌘Z）">↷</button>
    <div class="menu">
      <button id="fileBtn" class="ic" aria-label="ファイル" aria-haspopup="true" title="ファイル（新規・開く・保存）"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M5 2.5h6.5L15.5 6.5V17.5H5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M11.5 2.5V6.5H15.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.5 10.5h5M7.5 13.5h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
      <div class="menu-pop" id="fileMenu" hidden>
        <button data-act="new">新規</button><button data-act="demo">サンプルを開く</button>
        <button data-act="open">開く…<kbd>⌘O</kbd></button>
        <button data-act="save">上書き保存<kbd>⌘S</kbd></button><button data-act="saveas">名前を付けて保存…<kbd>⇧⌘S</kbd></button>
      </div>
    </div>
    <button id="printBtn" title="コード譜のプレビュー（印刷／PDF に保存）">コード譜</button>
    <div class="menu">
      <button id="themeBtn" class="ic" title="設定（テーマ・ウィンドウを広げたとき）" aria-label="設定" aria-haspopup="true"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M8.61 3.75 L8.98 1.66 L11.02 1.66 L11.39 3.75 L13.44 4.60 L15.17 3.38 L16.62 4.83 L15.40 6.56 L16.25 8.61 L18.34 8.98 L18.34 11.02 L16.25 11.39 L15.40 13.44 L16.62 15.17 L15.17 16.62 L13.44 15.40 L11.39 16.25 L11.02 18.34 L8.98 18.34 L8.61 16.25 L6.56 15.40 L4.83 16.62 L3.38 15.17 L4.60 13.44 L3.75 11.39 L1.66 11.02 L1.66 8.98 L3.75 8.61 L4.60 6.56 L3.38 4.83 L4.83 3.38 L6.56 4.60Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
      <div class="menu-pop theme-pop" id="themeMenu" hidden>
        <span class="menu-lbl">テーマ</span>
        <button data-v="light" aria-checked="false" role="menuitemradio">☀ ライト</button>
        <button data-v="dark" aria-checked="false" role="menuitemradio">☾ ダーク</button>
        <button data-v="auto" aria-checked="false" role="menuitemradio" title="OS の外観（ライト／ダーク）に合わせる">◐ 自動</button>
        <button data-v="kawaii" aria-checked="false" role="menuitemradio"><span class="swatch" style="--s1:#FBE3EC;--s2:#F28DB2;--s3:#8FD3C1" aria-hidden="true"></span>Kawaii</button>
        <button data-v="cyber" aria-checked="false" role="menuitemradio"><span class="swatch" style="--s1:#2A3038;--s2:#40BEF0;--s3:#D2DAE2" aria-hidden="true"></span>Cyber</button>
        <button data-v="modern" aria-checked="false" role="menuitemradio"><span class="swatch" style="--s1:#F4F4F5;--s2:#18181B;--s3:#2563EB" aria-hidden="true"></span>Modern</button>
        <button data-v="luxury" aria-checked="false" role="menuitemradio"><span class="swatch" style="--s1:#232321;--s2:#E0973E;--s3:#D9BE84" aria-hidden="true"></span>Luxury</button>
        <button data-v="old" aria-checked="false" role="menuitemradio"><span class="swatch" style="--s1:#D3D5D2;--s2:#E4962A;--s3:#7A4C2A" aria-hidden="true"></span>Old</button>
        <div class="menu-sep" role="separator"></div>
        <span class="menu-lbl">ウィンドウを広げたとき</span>
        <button data-scale="zoom" aria-checked="false" role="menuitemradio" title="画面全体を拡大する（文字やボタンも大きくなる）">全体を拡大</button>
        <button data-scale="expand" aria-checked="false" role="menuitemradio" title="文字の大きさは下の「大きさ」のままで広げる">広げる</button>
        <div class="menu-size" id="uiSizeRow" title="「広げる」のときの文字やボタンの大きさ"><span>大きさ</span><button data-size="1">100%</button><button data-size="1.25">125%</button><button data-size="1.5">150%</button><button data-size="1.75">175%</button></div>
      </div>
    </div>
    <input id="fileInput" type="file" accept=".chordsketch,.json" hidden>
  </header>

  <aside class="left panel" aria-label="サイドパネル">
    <button id="sidePin" class="tg side-pin" aria-pressed="false" aria-label="サイドパネルを固定" title="左に固定する"><svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><path d="M7 3h6l-1 5 3 3H5l3-3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 11v6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    <svg id="wheel" viewBox="-210 -215 420 425" role="group" aria-label="五度圏"></svg>
    <div class="keyrow">
      <select id="keySel" aria-label="キー"></select>
      <button id="keepNames" class="tg small" aria-pressed="false" title="コード固定：キーを変えてもコードはそのまま">コード固定</button>
    </div>
    <div class="keyrow">
      <select id="scaleSel" aria-label="スケール" title="スケール"></select>
    </div>
    <div class="sub-head" title="クリックで試聴・ダブルクリックで入力・ドラッグで配置">ダイアトニック<span class="spacer"></span>
      <div class="seg small" id="diaSeg"><button data-v="7" aria-pressed="true">4和音</button><button data-v="3" aria-pressed="false">3和音</button></div></div>
    <div class="palette" id="dia"></div>
    <div class="sub-head">コード作成</div>
    <div class="builder">
      <select id="bRoot" aria-label="ルート"></select><select id="bQ" aria-label="種類"></select><select id="bBass" aria-label="ベース"></select>
      <div class="palette one" id="custom"></div>
    </div>
    <div class="sub-head" title="定番のコード進行（派生形も選べる）">プリセット</div>
    <div class="prog-row"><select id="progSel" aria-label="コード進行"></select><select id="progVar" aria-label="派生"></select></div>
    <div class="prog-names" id="progNames"></div>
    <div class="prog-row"><button id="progPlay" title="この進行を試聴（もう一度押すと止める）">試聴</button><button id="progIns" class="ins" title="カーソルの小節から上書きで入れる">挿入</button></div>
    <div class="sub-head">MIDI 入力 <span class="midi-st" id="midiSt"></span><span class="spacer"></span>
      <button id="stepBtn" class="tg small" aria-pressed="false" title="弾いたコードをカーソルに入れて進む">ステップ入力</button></div>
    <div class="live" id="live"><span class="muted">MIDI 鍵盤で弾くとコード名を表示</span></div>
  </aside>

  <main class="main panel">
    <div class="tabs" id="tabs" role="tablist" aria-label="曲タブ"></div>
    <div class="toolbar" role="toolbar" aria-label="編集バー">
      <div class="seg view-seg" id="viewSeg" role="tablist" aria-label="表示"><button data-v="chords" title="コードビュー（Tab で切り替え）">コード</button><button data-v="melody" title="メロディービュー（Tab で切り替え）">メロディー</button></div>
      <span class="lbl">スナップ</span>
      <div class="seg small only-chords" id="snapSeg"><button data-v="bar">1小節</button><button data-v="beat">1拍</button><button data-v="half" title="シンコペーション・食いのコード用">半拍</button></div>
      <select id="mSnap" class="only-melody" aria-label="メロディーのスナップ" title="音を置く・動かす位置の単位"></select>
      <label class="fld only-chords" title="ダイアトニック・数字キー・MIDI 入力で入れるコードの長さ">長さ <select id="insLen"></select></label>
      <label class="fld only-melody" title="クリック・MIDI 鍵盤のステップ入力で置く音の長さ">長さ <select id="mLen"></select></label>
      <span class="lbl" title="1行に並べる小節の数">表示</span>
      <div class="seg small only-chords" id="rowSeg" title="1行に並べる小節の数"><button data-v="4" title="1行に4小節">4</button><button data-v="8" title="1行に8小節">8</button></div>
      <input type="range" id="zoomBar" class="only-melody zoom-bar" min="0" max="100" step="1" aria-label="横の拡大" title="横の拡大（2本指で広げる・つまむでも）">
      <span class="spacer"></span>
      <!-- MIDI の書き出し：入れるもの → ドラッグ（つまみに範囲） → 保存 の順に、ひとつの枠にまとめる -->
      <div class="midi-box" role="group" aria-label="MIDI の書き出し">
        <span class="midi-lbl">MIDI</span>
        <select id="midiParts" aria-label="MIDI に入れるもの" title="入れるもの（両方なら2トラック）">
          <option value="both">コード＋メロ</option><option value="chords">コードのみ</option><option value="melody">メロのみ</option></select>
        <button class="handle" id="dragSel" title="ドラッグで DAW へ（範囲を選んでいればその範囲）">⠿ <span id="dragLabel">曲全体</span></button>
        <button id="saveMidi" title="MIDI ファイルに保存">保存…</button>
      </div>
    </div>
    <div class="toolbar out only-chords" role="toolbar" aria-label="サウンドバー">
      <label class="fld" title="コードの試聴の音色（MIDI には影響しない）">音色 <select id="timbre"></select></label>
      <label class="fld vol" title="コードの再生の音量（MIDI には影響しない）">音量 <input type="range" id="chordVol" class="zoom-bar vol-bar" min="0" max="100" step="1" aria-label="コードの音量"></label>
      <span class="sep"></span>
      <span class="lbl strong" title="MIDI の出力（パターン・鳴らし方・オクターブ・ベース）">出力</span>
      <label class="fld" title="曲全体のパターン（セクションごとに変えられます）">パターン <select id="pattern"></select></label>
      <span class="sep"></span>
      <div class="seg small" id="voicingSeg" title="鳴らし方：ピアノ（和音）／ギター（ストローク）"><button data-v="piano">ピアノ</button><button data-v="guitar">ギター</button></div>
      <div class="seg small" id="areaSeg" title="ギターのポジション"><button data-v="low" title="ローポジション">Low</button><button data-v="mid" title="ミドルポジション">Mid</button><button data-v="high" title="ハイポジション">High</button></div>
      <span class="sep"></span>
      <span class="lbl">上声</span><div class="oct" id="octUp"></div>
      <button id="bassBtn" class="tg small" aria-pressed="true" title="ベース音を出す／出さない（右はベースのオクターブ）">ベース</button><div class="oct" id="octBass"></div>
    </div>
    <div class="toolbar out only-melody" role="toolbar" aria-label="サウンドバー">
      <div class="seg small tool-seg" id="toolSeg" title="道具（⌘で入れ替え）">
        <button data-v="draw" aria-label="描く" title="描く：押して音を置く・右へ引いて長さ（⌘で選ぶ）"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3 13l.8-3.2L11 2.6a1.3 1.3 0 0 1 1.8 0l.6.6a1.3 1.3 0 0 1 0 1.8L6.2 12.2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M9.8 3.8l2.4 2.4" stroke="currentColor" stroke-width="1.5"/></svg></button>
        <button data-v="select" aria-label="選ぶ" title="選ぶ：ドラッグで囲んで選ぶ（⌘で描く）"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="2.5" y="3.5" width="11" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2.4 1.6"/></svg></button></div>
      <span class="sep"></span>
      <label class="fld" title="メロディーの試聴の音色（MIDI には影響しない）">音色 <select id="mTimbre"></select></label>
      <label class="fld vol" title="メロディーの再生の音量（MIDI には影響しない）">音量 <input type="range" id="melVol" class="zoom-bar vol-bar" min="0" max="100" step="1" aria-label="メロディーの音量"></label>
      <span class="sep"></span>
      <span class="lbl">鳴らす</span>
      <button id="hearChords" class="tg small" aria-pressed="true" title="コード（伴奏）も鳴らす">コード</button>
      <button id="hearMelody" class="tg small" aria-pressed="true" title="メロディーも鳴らす（オフで伴奏だけ）">メロディー</button>
      <span class="sep"></span>
      <span class="lbl" title="メロディービューの行に色を付ける">ガイド</span>
      <div class="seg small tg-pair" role="group" aria-label="コードトーン">
        <button id="guideChord" aria-pressed="true" title="コードトーンの行に色（ルートは濃く）">コードトーン</button><button id="rollDeg" aria-pressed="true" title="度数（R・3・5…）を出す・消す">度数</button></div>
      <button id="guideScale" class="tg small" aria-pressed="true" title="キーのスケールの音の行に色を付ける">スケール</button>
      <span class="sep"></span>
      <span class="lbl" title="縦の大きさ（行の高さ）">縦</span>
      <input type="range" id="rowSize" class="zoom-bar row-bar" min="12" max="40" step="1" aria-label="縦の大きさ" title="縦の大きさ（行の高さ）">
    </div>
    <div class="sheet" id="sheet" tabindex="0" aria-label="コードビュー"></div>
    <div class="roll" id="roll" tabindex="0" aria-label="メロディービュー" hidden></div>
    <aside class="vpanel" id="vpanel" aria-label="コード編集パネル" hidden></aside>
    <div class="footer" id="footer" role="region" aria-label="インフォバー"></div>
    <!-- iPhone：下のパッド（ダイアトニック・プリセット・キー） -->
    <div class="phone-pads phone-only" id="phonePads" role="region" aria-label="パッド">
      <div class="pp-tabs" id="ppTabs"><button class="tg" data-t="chords" aria-pressed="true">コード</button><button class="tg" data-t="prog" aria-pressed="false">プリセット</button><button class="tg" data-t="key" aria-pressed="false">キー</button><button class="tg" data-t="sound" aria-pressed="false" title="コードの音色・パターン・鳴らし方">音</button></div>
      <div class="pp-body" id="ppBody"></div>
    </div>
  </main>
</div>

<div class="pop" id="pop" hidden></div>
<div class="ghost" id="ghost" hidden></div>
<datalist id="secNames"></datalist>
<div class="print-wrap" id="printWrap" hidden>
  <div class="print-bar"><b>コード譜のプレビュー</b><span class="spacer"></span>
    <label class="fld"><input type="checkbox" id="prDeg"> 度数も書く</label>
    <button id="prGo" class="tg" aria-pressed="true">印刷／PDF に保存</button><button id="prClose">閉じる</button></div>
  <div class="print-scroll"><div class="print" id="print"></div></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
